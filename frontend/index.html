<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- ============================================================
         Prahari — MedLens Application
         The Sentinel: Medication Demystifier, Symptom Triage &
         Local Doctor Directory
         ============================================================ -->

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/prahari-icon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Viewport — mobile-first, prevents auto-zoom on input focus -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO Meta Tags -->
    <title>Prahari — Your Personal Health Sentinel</title>
    <meta
      name="description"
      content="Prahari (MedLens) helps you decode medication labels, assess symptoms, and find nearby doctors — all powered by clinically authoritative data sources."
    />
    <meta name="theme-color" content="#2D5A3D" />

    <!-- Open Graph -->
    <meta property="og:title" content="Prahari — Your Personal Health Sentinel" />
    <meta property="og:description" content="Decode medication labels, assess symptoms, and find nearby doctors." />
    <meta property="og:type" content="website" />

    <!-- ============================================================
         TYPOGRAPHY — "Warm Rx" Font Stack
         Source: FEATURES_AND_STRUCTURE.md § 4.3

         Fonts loaded:
           • Fraunces           — Display headings (300, 400, 600)
           • Plus Jakarta Sans  — Body text and UI labels (400, 500, 600, 700)
           • JetBrains Mono     — Drug names, RxCUI codes (400, 500)

         Using Google Fonts with display=swap to prevent FOUT.
         ============================================================ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- React root mount point -->
    <div id="root"></div>

    <!-- Vite entry point -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
